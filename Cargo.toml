[package]
name = "alfa-site"
version = "1.0.0"
edition = "2021"
description = "Alfa Global Group website, server-rendered in Rust"
publish = false
license-file = "LICENSE.md"

[dependencies]
askama = "0.12"
axum = "0.7"
dotenvy = "0.15"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
time = { version = "0.3", features = ["formatting"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "signal", "fs", "io-util", "sync", "time"] }
tower-http = { version = "0.5", features = ["fs", "compression-gzip", "compression-br", "set-header", "trace"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
