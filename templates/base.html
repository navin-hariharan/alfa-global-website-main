<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>{{ page.title }}</title>
  <meta name="description" content="{{ page.description }}">
  <link rel="canonical" href="{{ page.canonical }}">
  <meta name="theme-color" content="#052540">
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="Alfa Global Group">
  <meta property="og:title" content="{{ page.title }}">
  <meta property="og:description" content="{{ page.description }}">
  <meta property="og:url" content="{{ page.canonical }}">
  <meta property="og:image" content="/static/img/og.png">
  <link rel="icon" href="/favicon.ico" sizes="any">
  <link rel="icon" href="/static/img/icon-32.png" type="image/png" sizes="32x32">
  <link rel="icon" href="/static/img/icon-192.png" type="image/png" sizes="192x192">
  <link rel="apple-touch-icon" href="/static/img/icon-180.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600&family=Nunito+Sans:opsz,wght@6..12,400;6..12,600;6..12,700;6..12,800&display=swap">
  <link rel="stylesheet" href="/static/css/site.css?v={{ page.v }}">
  <script src="/static/js/boot.js?v={{ page.v }}"></script>
  <script src="/static/js/site.js?v={{ page.v }}" defer></script>
</head>
<body>
  <a class="skip-link" href="#main">Skip to content</a>
  {% include "partials/loader.html" %}
  <div class="progress" aria-hidden="true"></div>
  {% include "partials/header.html" %}

  <main id="main">
    {% block content %}{% endblock %}
  </main>

  {% include "partials/footer.html" %}

  <div class="fab-stack">
    <a class="fab fab--wa" href="https://wa.me/917305626795?text=Hello%20Alfa%20Global%20Group" target="_blank" rel="noopener" aria-label="Chat on WhatsApp">{{ page.icon("whatsapp")|safe }}</a>
    <button class="fab fab--top" type="button" aria-label="Back to top" data-top>{{ page.icon("chevron")|safe }}</button>
  </div>
</body>
</html>
